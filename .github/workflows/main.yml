name: CI-CD Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - devops

env:
  IMAGE_NAME: sagarpatil98/cicd-demo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.run_number }} \
            ./app

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.run_number }}

      - name: Update Helm image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.run_number }}\"|g" cicd-demo/values.yaml

      - name: Commit and Push Helm values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cicd-demo/values.yaml
          git commit -m "ci: update image tag to ${{ github.run_number }}" || echo "No changes to commit"
          git push origin devops
