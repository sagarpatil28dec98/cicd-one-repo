apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: cicd-demo
          # image: sagarpatil98/cicd-demo:30
          # imagePullPolicy: IfNotPresent
          # image: sagarpatil98/cicd-demo:30
          image: sagarpatil98/cicd-demo:30
          imagePullPolicy: Always
          ports:
            - containerPort: 80
